<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rev TechingMaster</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="app" class="layout">
  <aside id="sidebar">
    <div class="brand">
      <img id="brandIcon" src="icon.png" alt="Rev TechingMaster" />
      <div class="brand-text">Rev TechingMaster</div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button id="btn-theme" title="切换浅色/深色主题">主题：浅/深</button>
      <div class="proxy-state" id="proxy-state">未连接服务器</div>
    </div>
  </aside>

  <main id="content">
    <header id="page-head">
      <h1 id="page-title">教案生成</h1>
      <div id="head-note" class="note-chip">AI 生成内容仅供参考，请结合实际审核后使用</div>
    </header>
    <section id="pages"></section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
